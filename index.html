<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伊纳特语词典 · Modern Inattian Dictionary</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__title">
    <h1>伊纳特语词典</h1>
    <p class="site-header__subtitle">Modern Inattian Dictionary</p>
  </div>

  <div class="search-box">
    <input
      id="search-input"
      type="search"
      placeholder="搜索词条 · Modern Inattian / 中文 / English / Español"
      autocomplete="off"
    >
    <button type="button" id="search-clear" class="search-clear" aria-label="清空搜索" hidden>×</button>
  </div>
</header>

<nav id="alphabet-nav" class="alphabet-nav" aria-label="按首字母筛选"></nav>

<main id="app-main">
  <div id="breadcrumb" class="breadcrumb" hidden></div>
  <div id="status-banner" class="status-banner" hidden></div>
  <p id="list-meta" class="list-meta" hidden></p>
  <div id="entry-list" class="entry-list"></div>
  <div id="entry-detail" class="entry-detail" hidden></div>

  <section id="about-card" class="about-card">
    <h2 class="about-card__title">Modern Inattian</h2>
    <p class="about-card__text">
      伊纳特语在线词典，收录名词、动词、形容词等词条，提供中、英、西三语释义与变格变位。
      词条由本地 JSON 源文件与 make_index.py 自动生成，本页为只读静态阅读器。
    </p>
    <div class="about-card__deco" aria-hidden="true">
      <svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
        <circle cx="40" cy="60" r="26" style="fill:var(--yellow)"></circle>
        <polygon points="100,30 140,60 100,90" style="fill:var(--blue)"></polygon>
        <circle cx="200" cy="40" r="16" style="fill:var(--pink)"></circle>
        <path d="M240 90 a30 30 0 0 1 60 0 Z" style="fill:var(--teal)"></path>
        <rect x="270" y="20" width="24" height="24" style="fill:var(--red)" transform="rotate(20 282 32)"></rect>
      </svg>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>词典数据由本地 JSON 源文件与 <code>make_index.py</code> 自动生成 · 页面为只读静态词典阅读器</p>
</footer>

<script src="main.js"></script>
</body>
</html>
