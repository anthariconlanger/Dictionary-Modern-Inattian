name: Update dictionary index

on:
  push:
    branches: [main]
    paths:
      - "data/**.json"
      - "make_index.py"

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run make_index.py
        run: python make_index.py

      - name: Commit updated index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/index.json; then
            echo "index.json 无变化，跳过提交。"
            exit 0
          fi
          git add data/index.json
          git commit -m "chore: auto-update data/index.json [skip ci]"
          git push
